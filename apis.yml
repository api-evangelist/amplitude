name: Amplitude
description: Amplitude is a digital analytics platform that helps product teams understand
  user behavior, run experiments, and drive growth. It provides a suite of APIs for
  event ingestion, user management, cohort syncing, taxonomy governance, A/B testing,
  and data export. Amplitude is widely used by product, data, and engineering teams
  to build better digital experiences through data-driven insights.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/amplitude.png
tags:
- A/B Testing
- Analytics
- Experimentation
- Feature Flags
- Product Analytics
- User Behavior
apis:
- aid: amplitude:batch-event-upload-api
  name: Amplitude Batch Event Upload API
  tags:
  - Analytics
  - Batch
  - Event
  - Ingestion
  tags_raw:
  - Analytics
  - Batch
  - Events
  - Ingestion
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api2.amplitude.com
  humanURL: https://amplitude.com/docs/apis/analytics/batch-event-upload
  properties:
  - url: https://amplitude.com/docs/apis/analytics/batch-event-upload
    type: Documentation
  description: >-
    The Amplitude Batch Event Upload API is optimized for high-volume server-side event ingestion. It
    accepts batches of events up to 20MB per request and is designed for use cases where data volume may
    exceed the limits of the standard HTTP V2 API. The API uses the same event structure as the HTTP V2
    API and is recommended for data pipelines processing millions of events.
- aid: amplitude:group-identify-api
  name: Amplitude Group Identify API
  tags:
  - Analytics
  - Group
  - Identity
  - Properties
  tags_raw:
  - Analytics
  - Groups
  - Identity
  - Properties
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api2.amplitude.com
  humanURL: https://amplitude.com/docs/apis/analytics/group-identify
  properties:
  - url: https://amplitude.com/docs/apis/analytics/group-identify
    type: Documentation
  description: >-
    The Amplitude Group Identify API allows developers to set or update properties on groups within Amplitude.
    Groups are entities such as companies, teams, or accounts that users belong to. This API enables B2B
    analytics use cases by attaching account-level properties to groups for segmentation and reporting
    purposes.
- aid: amplitude:releases-api
  name: Amplitude Releases API
  tags:
  - Analytics
  - Deployment
  - Releases
  - Tracking
  tags_raw:
  - Analytics
  - Deployments
  - Releases
  - Tracking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://amplitude.com
  humanURL: https://amplitude.com/docs/apis/analytics/releases
  properties:
  - url: https://amplitude.com/docs/apis/analytics/releases
    type: Documentation
  description: >-
    The Amplitude Releases API allows developers to programmatically track software releases and deployments
    in Amplitude. By recording release events, teams can correlate product changes with analytics metrics
    to understand the impact of each deployment on user behavior, retention, and engagement.
- aid: amplitude:session-replay-api
  name: Amplitude Session Replay API
  tags:
  - Analytics
  - Replay
  - Sessions
  - User Experience
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://amplitude.com
  humanURL: https://amplitude.com/docs/apis/analytics/session-replay
  properties:
  - url: https://amplitude.com/docs/apis/analytics/session-replay
    type: Documentation
  description: >-
    The Amplitude Session Replay API enables developers to upload and manage session replay data for playback
    within Amplitude. Session replays provide qualitative insights by recording user interactions and
    pairing them with quantitative analytics data. This API is used for server-side ingestion of session
    replay events and metadata.
- aid: amplitude:user-privacy-api
  name: Amplitude User Privacy API
  tags:
  - Compliance
  - GDPR
  - Privacy
  - User
  tags_raw:
  - Compliance
  - GDPR
  - Privacy
  - Users
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://amplitude.com
  humanURL: https://amplitude.com/docs/apis/analytics/user-privacy
  properties:
  - url: https://amplitude.com/docs/apis/analytics/user-privacy
    type: Documentation
  description: >-
    The Amplitude User Privacy API provides endpoints for managing user data in compliance with privacy
    regulations such as GDPR and CCPA. It supports requesting the deletion or suppression of user data
    by user ID or device ID, enabling organizations to fulfill data subject rights requests and maintain
    regulatory compliance.
- aid: amplitude:webhooks-cohort-sync
  name: Amplitude Webhooks and Cohort Sync
  tags:
  - Cohort Sync
  - Destinations
  - Event
  - Streaming
  - Webhook
  tags_raw:
  - Cohort Sync
  - Destinations
  - Events
  - Streaming
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://amplitude.com/docs/data/destination-catalog/webhooks
  properties:
  - url: https://amplitude.com/docs/data/destination-catalog/webhooks
    type: Documentation
  - url: https://amplitude.com/docs/data/destinations/syncs
    type: Documentation
  - url: https://amplitude.com/docs/data/destinations
    type: Documentation
  - url: asyncapi/amplitude-webhooks-cohort-sync-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Webhooks Streaming destination forwards Amplitude event and user payloads to a customer-configured
    HTTPS endpoint, and the Cohort Sync family of destinations pushes cohort membership changes to downstream
    tools such as Iterable, Braze, MoEngage, Customer.io, Intercom, HubSpot, Google Ads, Bing Ads, Google
    Pub/Sub, Amazon Kinesis, and Amazon S3. Sync types include on-demand, automated (hourly or daily),
    and real-time (per-minute) modes. This AsyncAPI document models the subscriber-side HTTP contract
    for Webhooks Streaming and the generic cohort membership change shape; vendor-specific cohort sync
    destinations conform to each downstream tool's own API contract.
