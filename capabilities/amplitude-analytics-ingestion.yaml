naftiko: 1.0.0-alpha2
info:
  label: Amplitude Analytics Ingestion
  description: Unified workflow for sending events and identifying users. For data engineers.
  tags:
  - Amplitude
  - Analytics
  - Event Ingestion
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: attribution-api
    baseUri: https://api2.amplitude.com
    description: The Amplitude Attribution API allows developers to send attribution campaign events to Amplitude from ad
      networks, attribution providers, or custom marketing tools. It associates users with the campaigns, channels, and creatives
      that drove their acquisition or re-engagement. This API is used to enrich Amplitude user profiles with marketing attribution
      data for campaign performance analysis and ROI measurement.
    resources:
    - name: attribution
      path: /attribution
      description: Attribution operations
      operations:
      - name: sendAttribution
        method: POST
        description: Amplitude Send Attribution Data
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: http-v2-api
    baseUri: https://api2.amplitude.com
    description: The Amplitude HTTP V2 API enables developers to send event data directly from servers or clients to Amplitude's
      analytics platform. It supports uploading individual or batched events along with user properties, event properties,
      and group properties. This API is the primary method for server-side event ingestion and is designed for high-throughput
      data collection with built-in validation and error reporting.
    resources:
    - name: events
      path: /events
      description: Events operations
      operations:
      - name: uploadEvents
        method: POST
        description: Amplitude Upload Events
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: identify-api
    baseUri: https://api2.amplitude.com
    description: The Amplitude Identify API allows developers to update user properties for a specific user without needing
      to send an accompanying event. This is useful for setting or modifying user attributes such as demographics, subscription
      status, or preferences outside of the normal event tracking flow. The API supports operations like set, unset, append,
      and prepend on user properties.
    resources:
    - name: identify
      path: /identify
      description: Identify operations
      operations:
      - name: identifyUser
        method: POST
        description: Amplitude Identify a User
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: amplitude-analytics-ingestion-api
    description: REST API for Amplitude Analytics Ingestion
    resources:
    - path: /v1/attribution
      name: attribution
      operations:
      - method: POST
        name: sendAttribution
        description: Amplitude Send Attribution Data
        call: attribution-api.sendAttribution
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events
      name: events
      operations:
      - method: POST
        name: uploadEvents
        description: Amplitude Upload Events
        call: http-v2-api.uploadEvents
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/identify
      name: identify
      operations:
      - method: POST
        name: identifyUser
        description: Amplitude Identify a User
        call: identify-api.identifyUser
        with: {}
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: amplitude-analytics-ingestion-mcp
    transport: http
    description: MCP for Amplitude Analytics Ingestion
    tools:
    - name: attribution-api-sendAttribution
      description: Amplitude Send Attribution Data
      hints:
        readOnly: false
      call: attribution-api.sendAttribution
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: http-v2-api-uploadEvents
      description: Amplitude Upload Events
      hints:
        readOnly: false
      call: http-v2-api.uploadEvents
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: identify-api-identifyUser
      description: Amplitude Identify a User
      hints:
        readOnly: false
      call: identify-api.identifyUser
      with: {}
      outputParameters:
      - type: object
        mapping: $.
