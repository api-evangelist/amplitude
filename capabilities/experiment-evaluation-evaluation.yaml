naftiko: 1.0.0-alpha2
info:
  label: Amplitude Experiment Evaluation API — Evaluation
  description: 'Amplitude Experiment Evaluation API — Evaluation. 2 operations. Lead operation: Amplitude Evaluate Variants
    for a User. Self-contained Naftiko capability covering one Amplitude business surface.'
  tags:
  - Amplitude
  - Evaluation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: experiment-evaluation-evaluation
    baseUri: https://api.lab.amplitude.com
    description: Amplitude Experiment Evaluation API — Evaluation business capability. Self-contained, no shared references.
    resources:
    - name: v1-vardata
      path: /v1/vardata
      operations:
      - name: evaluatevariants
        method: POST
        description: Amplitude Evaluate Variants for a User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: evaluatevariantsget
        method: GET
        description: Amplitude Evaluate Variants for a User via GET
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: query
          type: string
          description: The user ID to evaluate variants for.
        - name: device_id
          in: query
          type: string
          description: The device ID to evaluate variants for.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMPLITUDE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: experiment-evaluation-evaluation-rest
    port: 8080
    description: REST adapter for Amplitude Experiment Evaluation API — Evaluation. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/vardata
      name: v1-vardata
      description: REST surface for v1-vardata.
      operations:
      - method: POST
        name: evaluatevariants
        description: Amplitude Evaluate Variants for a User
        call: experiment-evaluation-evaluation.evaluatevariants
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: evaluatevariantsget
        description: Amplitude Evaluate Variants for a User via GET
        call: experiment-evaluation-evaluation.evaluatevariantsget
        with:
          user_id: rest.user_id
          device_id: rest.device_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: experiment-evaluation-evaluation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amplitude Experiment Evaluation API — Evaluation. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: amplitude-evaluate-variants-user
      description: Amplitude Evaluate Variants for a User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: experiment-evaluation-evaluation.evaluatevariants
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amplitude-evaluate-variants-user-get
      description: Amplitude Evaluate Variants for a User via GET
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: experiment-evaluation-evaluation.evaluatevariantsget
      with:
        user_id: tools.user_id
        device_id: tools.device_id
      outputParameters:
      - type: object
        mapping: $.
