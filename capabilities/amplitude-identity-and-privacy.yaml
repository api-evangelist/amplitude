naftiko: 1.0.0-alpha2
info:
  label: Amplitude Identity and Privacy
  description: SCIM provisioning and privacy compliance. For IT admins and compliance teams.
  tags:
  - Amplitude
  - Identity
  - Privacy
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: dsar-api
    baseUri: https://amplitude.com
    description: The Amplitude Data Subject Access Request (DSAR) API enables organizations to programmatically handle privacy
      requests in compliance with GDPR, CCPA, and other data protection regulations. It supports submitting deletion requests
      for user data based on user IDs or device IDs, and retrieving all data associated with a user. This API allows companies
      to automate their privacy compliance workflows and ensure timely processing of data subject requests at scale.
    resources:
    - name: data-access
      path: /data-access
      description: Data Access operations
      operations:
      - name: createDsarRequest
        method: POST
        description: Amplitude Create a Data Subject Access Request
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getDsarRequestStatus
        method: GET
        description: Amplitude Get DSAR Request Status
        inputParameters:
        - name: request_id
          in: path
          type: string
          required: true
          description: The ID of the DSAR request to check.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: data-deletion
      path: /data-deletion
      description: Data Deletion operations
      operations:
      - name: listDeletionRequests
        method: GET
        description: Amplitude List Deletion Requests
        inputParameters:
        - name: start_day
          in: query
          type: string
          required: false
          description: The start date to filter deletion requests in YYYY-MM-DD format.
        - name: end_day
          in: query
          type: string
          required: false
          description: The end date to filter deletion requests in YYYY-MM-DD format.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createDeletionRequest
        method: POST
        description: Amplitude Request User Data Deletion
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{AMPLITUDE_API_KEY}}'
      password: '{{AMPLITUDE_SECRET_KEY}}'
  - type: http
    namespace: scim-api
    baseUri: https://core.amplitude.com
    description: The Amplitude SCIM API implements the System for Cross-domain Identity Management (SCIM) 2.0 standard for
      automated user provisioning and deprovisioning. It allows identity providers such as Okta, Azure AD, and OneLogin to
      automatically create, update, and deactivate user accounts in Amplitude. This API is essential for enterprise organizations
      that need centralized user lifecycle management and compliance with security policies.
    resources:
    - name: users
      path: /users
      description: Users operations
      operations:
      - name: listScimUsers
        method: GET
        description: Amplitude List SCIM Users
        inputParameters:
        - name: filter
          in: query
          type: string
          required: false
          description: A SCIM filter expression to narrow the results. For example, userName eq "user@example.com".
        - name: startIndex
          in: query
          type: integer
          required: false
          description: The 1-based index of the first result in the current set of results. Default is 1.
        - name: count
          in: query
          type: integer
          required: false
          description: The number of results per page. Default varies by implementation.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createScimUser
        method: POST
        description: Amplitude Create a SCIM User
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getScimUser
        method: GET
        description: Amplitude Get a SCIM User
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: replaceScimUser
        method: PUT
        description: Amplitude Replace a SCIM User
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateScimUser
        method: PATCH
        description: Amplitude Update a SCIM User
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteScimUser
        method: DELETE
        description: Amplitude Delete a SCIM User
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: groups
      path: /groups
      description: Groups operations
      operations:
      - name: listScimGroups
        method: GET
        description: Amplitude List SCIM Groups
        inputParameters:
        - name: filter
          in: query
          type: string
          required: false
          description: A SCIM filter expression to narrow results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createScimGroup
        method: POST
        description: Amplitude Create a SCIM Group
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getScimGroup
        method: GET
        description: Amplitude Get a SCIM Group
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateScimGroup
        method: PATCH
        description: Amplitude Update a SCIM Group
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteScimGroup
        method: DELETE
        description: Amplitude Delete a SCIM Group
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{AMPLITUDE_API_KEY}}'
  - type: http
    namespace: user-mapping-api
    baseUri: https://amplitude.com
    description: The Amplitude User Mapping (Aliasing) API allows developers to merge users with different user IDs together
      in Amplitude. This is useful when a user initially interacts with a product anonymously and later creates an account,
      or when users have multiple identifiers across different systems. The API maps these distinct identities into a single
      unified user profile to ensure accurate analytics and attribution.
    resources:
    - name: user-mapping
      path: /user-mapping
      description: User Mapping operations
      operations:
      - name: mapUser
        method: POST
        description: Amplitude Map User Identities
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: unmapUser
        method: POST
        description: Amplitude Unmap User Identities
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{AMPLITUDE_API_KEY}}'
      password: '{{AMPLITUDE_SECRET_KEY}}'
