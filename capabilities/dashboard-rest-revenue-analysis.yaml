naftiko: 1.0.0-alpha2
info:
  label: Amplitude Dashboard REST API — Revenue Analysis
  description: 'Amplitude Dashboard REST API — Revenue Analysis. 1 operations. Lead operation: Amplitude Get Revenue LTV Data.
    Self-contained Naftiko capability covering one Amplitude business surface.'
  tags:
  - Amplitude
  - Revenue Analysis
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: dashboard-rest-revenue-analysis
    baseUri: https://amplitude.com
    description: Amplitude Dashboard REST API — Revenue Analysis business capability. Self-contained, no shared references.
    resources:
    - name: api-2-revenue-day
      path: /api/2/revenue/day
      operations:
      - name: getrevenueltv
        method: GET
        description: Amplitude Get Revenue LTV Data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: m
          in: query
          type: string
          description: The revenue metric to compute.
        - name: s
          in: query
          type: string
          description: Segment definitions as a JSON-encoded array.
        - name: g
          in: query
          type: string
          description: The property to group results by.
    authentication:
      type: basic
      username: '{{env.AMPLITUDE_USER}}'
      password: '{{env.AMPLITUDE_PASS}}'
  exposes:
  - type: rest
    namespace: dashboard-rest-revenue-analysis-rest
    port: 8080
    description: REST adapter for Amplitude Dashboard REST API — Revenue Analysis. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/2/revenue/day
      name: api-2-revenue-day
      description: REST surface for api-2-revenue-day.
      operations:
      - method: GET
        name: getrevenueltv
        description: Amplitude Get Revenue LTV Data
        call: dashboard-rest-revenue-analysis.getrevenueltv
        with:
          m: rest.m
          s: rest.s
          g: rest.g
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dashboard-rest-revenue-analysis-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amplitude Dashboard REST API — Revenue Analysis. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: amplitude-get-revenue-ltv-data
      description: Amplitude Get Revenue LTV Data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dashboard-rest-revenue-analysis.getrevenueltv
      with:
        m: tools.m
        s: tools.s
        g: tools.g
      outputParameters:
      - type: object
        mapping: $.
