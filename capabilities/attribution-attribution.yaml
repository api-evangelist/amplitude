naftiko: 1.0.0-alpha2
info:
  label: Amplitude Attribution API — Attribution
  description: 'Amplitude Attribution API — Attribution. 1 operations. Lead operation: Amplitude Send Attribution Data. Self-contained
    Naftiko capability covering one Amplitude business surface.'
  tags:
  - Amplitude
  - Attribution
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: attribution-attribution
    baseUri: https://api2.amplitude.com
    description: Amplitude Attribution API — Attribution business capability. Self-contained, no shared references.
    resources:
    - name: attribution
      path: /attribution
      operations:
      - name: sendattribution
        method: POST
        description: Amplitude Send Attribution Data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: attribution-attribution-rest
    port: 8080
    description: REST adapter for Amplitude Attribution API — Attribution. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/attribution
      name: attribution
      description: REST surface for attribution.
      operations:
      - method: POST
        name: sendattribution
        description: Amplitude Send Attribution Data
        call: attribution-attribution.sendattribution
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: attribution-attribution-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amplitude Attribution API — Attribution. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amplitude-send-attribution-data
      description: Amplitude Send Attribution Data
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: attribution-attribution.sendattribution
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
