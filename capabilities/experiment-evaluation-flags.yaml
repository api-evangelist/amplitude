naftiko: 1.0.0-alpha2
info:
  label: Amplitude Experiment Evaluation API — Flags
  description: 'Amplitude Experiment Evaluation API — Flags. 1 operations. Lead operation: Amplitude Get Flag Configurations.
    Self-contained Naftiko capability covering one Amplitude business surface.'
  tags:
  - Amplitude
  - Flags
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: experiment-evaluation-flags
    baseUri: https://api.lab.amplitude.com
    description: Amplitude Experiment Evaluation API — Flags business capability. Self-contained, no shared references.
    resources:
    - name: v1-flags
      path: /v1/flags
      operations:
      - name: getflags
        method: GET
        description: Amplitude Get Flag Configurations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMPLITUDE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: experiment-evaluation-flags-rest
    port: 8080
    description: REST adapter for Amplitude Experiment Evaluation API — Flags. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/flags
      name: v1-flags
      description: REST surface for v1-flags.
      operations:
      - method: GET
        name: getflags
        description: Amplitude Get Flag Configurations
        call: experiment-evaluation-flags.getflags
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: experiment-evaluation-flags-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amplitude Experiment Evaluation API — Flags. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: amplitude-get-flag-configurations
      description: Amplitude Get Flag Configurations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: experiment-evaluation-flags.getflags
      outputParameters:
      - type: object
        mapping: $.
