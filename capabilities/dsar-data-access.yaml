naftiko: 1.0.0-alpha2
info:
  label: Amplitude Data Subject Access Request API — Data Access
  description: 'Amplitude Data Subject Access Request API — Data Access. 2 operations. Lead operation: Amplitude Create a
    Data Subject Access Request. Self-contained Naftiko capability covering one Amplitude business surface.'
  tags:
  - Amplitude
  - Data Access
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: dsar-data-access
    baseUri: https://amplitude.com
    description: Amplitude Data Subject Access Request API — Data Access business capability. Self-contained, no shared references.
    resources:
    - name: api-2-dsar-requests
      path: /api/2/dsar/requests
      operations:
      - name: createdsarrequest
        method: POST
        description: Amplitude Create a Data Subject Access Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-2-dsar-requests-request_id
      path: /api/2/dsar/requests/{request_id}
      operations:
      - name: getdsarrequeststatus
        method: GET
        description: Amplitude Get DSAR Request Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: request_id
          in: path
          type: string
          description: The ID of the DSAR request to check.
          required: true
    authentication:
      type: basic
      username: '{{env.AMPLITUDE_USER}}'
      password: '{{env.AMPLITUDE_PASS}}'
  exposes:
  - type: rest
    namespace: dsar-data-access-rest
    port: 8080
    description: REST adapter for Amplitude Data Subject Access Request API — Data Access. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/api/2/dsar/requests
      name: api-2-dsar-requests
      description: REST surface for api-2-dsar-requests.
      operations:
      - method: POST
        name: createdsarrequest
        description: Amplitude Create a Data Subject Access Request
        call: dsar-data-access.createdsarrequest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/2/dsar/requests/{request-id}
      name: api-2-dsar-requests-request-id
      description: REST surface for api-2-dsar-requests-request_id.
      operations:
      - method: GET
        name: getdsarrequeststatus
        description: Amplitude Get DSAR Request Status
        call: dsar-data-access.getdsarrequeststatus
        with:
          request_id: rest.request_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dsar-data-access-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amplitude Data Subject Access Request API — Data Access. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: amplitude-create-data-subject-access
      description: Amplitude Create a Data Subject Access Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: dsar-data-access.createdsarrequest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amplitude-get-dsar-request-status
      description: Amplitude Get DSAR Request Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dsar-data-access.getdsarrequeststatus
      with:
        request_id: tools.request_id
      outputParameters:
      - type: object
        mapping: $.
