naftiko: 1.0.0-alpha2
info:
  label: Amplitude Experimentation
  description: Manage and evaluate A/B experiments and feature flags. For product managers.
  tags:
  - Amplitude
  - Experimentation
  - Feature Flags
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: experiment-evaluation-api
    baseUri: https://api.lab.amplitude.com
    description: The Amplitude Experiment Evaluation API retrieves variant assignment data for users through remote evaluation.
      When called, it evaluates targeting rules and returns the assigned variant for each active experiment or feature flag.
      The API also tracks assignment events automatically in Amplitude Analytics. It is used by server-side applications that
      need to determine which experiment variant or feature flag value to serve to a given user in real time.
    resources:
    - name: evaluation
      path: /evaluation
      description: Evaluation operations
      operations:
      - name: evaluateVariantsGet
        method: GET
        description: Amplitude Evaluate Variants for a User via GET
        inputParameters:
        - name: user_id
          in: query
          type: string
          required: false
          description: The user ID to evaluate variants for.
        - name: device_id
          in: query
          type: string
          required: false
          description: The device ID to evaluate variants for.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: evaluateVariants
        method: POST
        description: Amplitude Evaluate Variants for a User
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: flags
      path: /flags
      description: Flags operations
      operations:
      - name: getFlags
        method: GET
        description: Amplitude Get Flag Configurations
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{AMPLITUDE_API_KEY}}'
      placement: header
  - type: http
    namespace: experiment-management-api
    baseUri: https://experiment.amplitude.com
    description: The Amplitude Experiment Management API provides programmatic control over feature flags and experiments.
      It supports creating, updating, activating, and archiving experiments and flags, as well as managing deployments, variants,
      holdout groups, and mutual exclusion groups. This API enables teams to integrate experiment lifecycle management into
      their CI/CD pipelines, automate flag rollouts, and manage experimentation workflows without using the Amplitude UI.
    resources:
    - name: flags
      path: /flags
      description: Flags operations
      operations:
      - name: listFlags
        method: GET
        description: Amplitude List All Flags
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: The maximum number of flags to return.
        - name: cursor
          in: query
          type: string
          required: false
          description: A cursor for pagination returned from a previous request.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createFlag
        method: POST
        description: Amplitude Create a Flag
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getFlag
        method: GET
        description: Amplitude Get a Flag
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateFlag
        method: PATCH
        description: Amplitude Update a Flag
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: experiments
      path: /experiments
      description: Experiments operations
      operations:
      - name: listExperiments
        method: GET
        description: Amplitude List All Experiments
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: The maximum number of experiments to return.
        - name: cursor
          in: query
          type: string
          required: false
          description: A cursor for pagination.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createExperiment
        method: POST
        description: Amplitude Create an Experiment
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getExperiment
        method: GET
        description: Amplitude Get an Experiment
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateExperiment
        method: PATCH
        description: Amplitude Update an Experiment
        inputParameters:
        - name: param
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deployments
      path: /deployments
      description: Deployments operations
      operations:
      - name: listDeployments
        method: GET
        description: Amplitude List All Deployments
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getDeployment
        method: GET
        description: Amplitude Get a Deployment
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: The unique identifier of the deployment.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: versions
      path: /versions
      description: Versions operations
      operations:
      - name: listVersions
        method: GET
        description: Amplitude List Flag and Experiment Versions
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: The maximum number of versions to return.
        - name: cursor
          in: query
          type: string
          required: false
          description: A cursor for pagination.
        - name: start
          in: query
          type: string
          required: false
          description: The start date for filtering versions.
        - name: end
          in: query
          type: string
          required: false
          description: The end date for filtering versions.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{AMPLITUDE_API_KEY}}'
  exposes:
  - type: rest
    port: 8082
    namespace: amplitude-experimentation-api
    description: REST API for Amplitude Experimentation
    resources:
    - path: /v1/evaluation
      name: evaluation
      operations:
      - method: GET
        name: evaluateVariantsGet
