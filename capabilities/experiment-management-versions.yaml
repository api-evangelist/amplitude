naftiko: 1.0.0-alpha2
info:
  label: Amplitude Experiment Management API — Versions
  description: 'Amplitude Experiment Management API — Versions. 1 operations. Lead operation: Amplitude List Flag and Experiment
    Versions. Self-contained Naftiko capability covering one Amplitude business surface.'
  tags:
  - Amplitude
  - Versions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: experiment-management-versions
    baseUri: https://experiment.amplitude.com
    description: Amplitude Experiment Management API — Versions business capability. Self-contained, no shared references.
    resources:
    - name: api-1-versions
      path: /api/1/versions
      operations:
      - name: listversions
        method: GET
        description: Amplitude List Flag and Experiment Versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: The maximum number of versions to return.
        - name: cursor
          in: query
          type: string
          description: A cursor for pagination.
        - name: start
          in: query
          type: string
          description: The start date for filtering versions.
        - name: end
          in: query
          type: string
          description: The end date for filtering versions.
    authentication:
      type: bearer
      token: '{{env.AMPLITUDE_API_KEY}}'
  exposes:
  - type: rest
    namespace: experiment-management-versions-rest
    port: 8080
    description: REST adapter for Amplitude Experiment Management API — Versions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/1/versions
      name: api-1-versions
      description: REST surface for api-1-versions.
      operations:
      - method: GET
        name: listversions
        description: Amplitude List Flag and Experiment Versions
        call: experiment-management-versions.listversions
        with:
          limit: rest.limit
          cursor: rest.cursor
          start: rest.start
          end: rest.end
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: experiment-management-versions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amplitude Experiment Management API — Versions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: amplitude-list-flag-and-experiment
      description: Amplitude List Flag and Experiment Versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: experiment-management-versions.listversions
      with:
        limit: tools.limit
        cursor: tools.cursor
        start: tools.start
        end: tools.end
      outputParameters:
      - type: object
        mapping: $.
