naftiko: 1.0.0-alpha2
info:
  label: Amplitude Dashboard REST API — Event List
  description: 'Amplitude Dashboard REST API — Event List. 1 operations. Lead operation: Amplitude List Event Types. Self-contained
    Naftiko capability covering one Amplitude business surface.'
  tags:
  - Amplitude
  - Event List
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMPLITUDE_API_KEY: AMPLITUDE_API_KEY
capability:
  consumes:
  - type: http
    namespace: dashboard-rest-event-list
    baseUri: https://amplitude.com
    description: Amplitude Dashboard REST API — Event List business capability. Self-contained, no shared references.
    resources:
    - name: api-2-events-list
      path: /api/2/events/list
      operations:
      - name: listeventtypes
        method: GET
        description: Amplitude List Event Types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.AMPLITUDE_USER}}'
      password: '{{env.AMPLITUDE_PASS}}'
  exposes:
  - type: rest
    namespace: dashboard-rest-event-list-rest
    port: 8080
    description: REST adapter for Amplitude Dashboard REST API — Event List. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/2/events/list
      name: api-2-events-list
      description: REST surface for api-2-events-list.
      operations:
      - method: GET
        name: listeventtypes
        description: Amplitude List Event Types
        call: dashboard-rest-event-list.listeventtypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dashboard-rest-event-list-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amplitude Dashboard REST API — Event List. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: amplitude-list-event-types
      description: Amplitude List Event Types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dashboard-rest-event-list.listeventtypes
      outputParameters:
      - type: object
        mapping: $.
